<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <link rel="stylesheet" href="register.css">
</head>
<body>
<button class="back-btn" onclick="goBack()">BACK</button>
<div class="register-container">
    <h1>Create Character</h1>
    <input type="email" placeholder="Email">
    <input type="text" placeholder="Username">
    <input type="password" placeholder="Password">

<div class="section">
    <p>Gender</p>

    <div class="gender-container">
        <div class="gender-card" data-value="male" onclick="selectGender(this)">
            Male
        </div>

        <div class="gender-card" data-value="female" onclick="selectGender(this)">
            Female
        </div>
    </div>

    <input type="hidden" id="genderInput">
</div>

    <div class="section">
        <p>Choose Class</p>

        <div class="class-container">
            <div class="class-card" onclick="selectClass(this)">
                <img src="img/class/warrior.png">
                <span>Warrior</span>
            </div>

            <div class="class-card" onclick="selectClass(this)">
                <img src="img/class/ranger.png">
                <span>Ranger</span>
            </div>

            <div class="class-card" onclick="selectClass(this)">
                <img src="img/class/wizard.png">
                <span>Wizard</span>
            </div>
        </div>
    </div>

    <button class="register-btn">REGISTER</button>
</div>

<script src="register.js"></script>
</body>
</html>
